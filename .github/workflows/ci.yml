name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # The integration tests shell out to the real git binary, so every platform
    # the manifest claims is worth running rather than cross-compiling for.
    # Windows is the one that catches path and environment assumptions: a
    # `$HOME` that is never set, backslashes in a worktree path, CRLF from git.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    # Windows would otherwise run these in PowerShell, where `||` is not the
    # shell operator the toolchain step is written against. Every runner ships
    # bash, so one shell keeps the steps identical across the matrix. This says
    # nothing about the plugin needing a shell — the binary does not.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml is the single source of truth for the version, and
      # the preinstalled rustup honours it on the first cargo call. Naming a
      # version here as well would let the two drift apart.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # The integration tests commit, so git needs an identity even where the
      # test helper does not set one.
      - name: Give git an identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  audit:
    runs-on: ubuntu-latest
    # audit-check publishes its findings as a check run, which the default
    # read-only token cannot create.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      # Fails on vulnerabilities; unmaintained and unsound advisories are
      # reported without blocking. What counts as which is set in
      # .cargo/audit.toml, so this run and `make audit` agree.
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

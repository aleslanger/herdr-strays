# herdr-strays — which files strayed from HEAD.
#
# Read-only: this plugin only ever queries git. It never stages, commits,
# checks out, stashes, or writes to refs/.

id = "aleslanger.strays"
name = "strays"
version = "1.0.0"
min_herdr_version = "0.7.0"
description = "Which files strayed from HEAD — see the diff, jump to your editor."
platforms = ["linux", "macos", "windows"]

# Run on `herdr plugin install`; skipped by `herdr plugin link`, where a local
# author builds the working tree themselves.
#
# The script downloads the release built for this platform and verifies its
# checksum, so no Rust toolchain is needed. It compiles from source only when
# there is no release to fetch.
#
# `sh` is the one thing here that Windows does not have, so this step alone does
# not run there — `plugin link` or placing the binary by hand does, which is what
# the README tells a Windows user to do. A PowerShell twin would mean two copies
# of the checksum check drifting apart, which is worse than one command that is
# honestly unavailable.
[[build]]
command = ["sh", "scripts/install.sh"]

# The viewer pane.
#
# The leading `./` is required. Measured against herdr 0.7.3: a command with a
# path separator resolves against the plugin root, a bare `bin/herdr-strays` is
# looked up in $PATH and fails, and $HERDR_PLUGIN_ROOT is never expanded — it
# reaches the spawner as a literal and fails the same way.
#
# No shell is involved, so none is needed on the platform running this.
[[panes]]
id = "strays"
title = "strays"
placement = "split"
command = ["./bin/herdr-strays"]

# Summons the pane. Bind this to a key in ~/.config/herdr/config.toml.
#
# The launch-or-focus rule lives in the binary rather than in a shell script:
# deciding it means reading `pane list`, which the binary already parses, and a
# second copy of that parser in another language is what a Windows port would
# otherwise have cost. See src/pane.rs.
[[actions]]
id = "open"
title = "strays: files that strayed from HEAD"
description = "Open the strayed-file viewer beside the current pane."
contexts = ["pane", "workspace"]
command = ["./bin/herdr-strays", "--open-pane"]

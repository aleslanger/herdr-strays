# cargo-audit configuration.
#
# Vulnerabilities fail the audit. Unmaintained and unsound advisories are
# reported but do not fail it, so a dependency with no fix available stays
# visible without blocking the build.
#
# Nothing is open against this tree today. The two that were — RUSTSEC-2024-0436
# (paste, unmaintained) and RUSTSEC-2026-0002 (lru, unsound `IterMut`) — were
# reached through ratatui 0.29 and went away with ratatui 0.30.

[advisories]
# Deliberately empty: nothing is hidden. The severities below decide what fails.
ignore = []

# Advisory kinds that report without failing the run.
informational_warnings = ["unmaintained", "unsound", "notice"]

# cargo-audit configuration.
#
# Vulnerabilities fail the audit. Unmaintained and unsound advisories are
# reported but do not fail it, so they stay visible without blocking a build
# over something that has no fix available at this MSRV.
#
# Two are open against this tree today, both reached through ratatui 0.29:
#
#   RUSTSEC-2024-0436  paste 1.0.15  unmaintained (proc-macro, no runtime surface)
#   RUSTSEC-2026-0002  lru 0.12.5    unsound `IterMut` (this crate never calls lru)
#
# Both are fixed by ratatui 0.30, which requires rustc 1.88. This crate targets
# 1.82 because herdr builds it on the user's machine at install time, and a
# six-version MSRV jump costs more than two non-vulnerability advisories.
# Revisit when the ecosystem's baseline has moved.

[advisories]
# Deliberately empty: nothing is hidden. The severities below decide what fails.
ignore = []

# Advisory kinds that report without failing the run.
informational_warnings = ["unmaintained", "unsound", "notice"]
